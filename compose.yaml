name: shopify-commerce-hub

x-app: &app
  build:
    context: .
    target: app
  image: shopify-commerce-hub-app:local
  restart: unless-stopped
  working_dir: /var/www/html
  volumes:
    - ./:/var/www/html
    - vendor:/var/www/html/vendor
    - storage:/var/www/html/storage
    - bootstrap-cache:/var/www/html/bootstrap/cache
  depends_on:
    setup:
      condition: service_completed_successfully

services:
  setup:
    build:
      context: .
      target: app
    image: shopify-commerce-hub-app:local
    working_dir: /var/www/html
    restart: "no"
    volumes:
      - ./:/var/www/html
      - vendor:/var/www/html/vendor
      - storage:/var/www/html/storage
      - bootstrap-cache:/var/www/html/bootstrap/cache
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["/usr/local/bin/setup-app"]

  app:
    <<: *app
    healthcheck:
      test: ["CMD-SHELL", "php -r 'exit(fsockopen(\"127.0.0.1\", 9000) ? 0 : 1);'"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  nginx:
    image: nginx:1.28-alpine
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8000}:80"
    volumes:
      - ./:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - storage:/var/www/html/storage:ro
    depends_on:
      app:
        condition: service_healthy
        restart: true

  cloudflared:
    image: cloudflare/cloudflared:2026.8.2
    profiles: ["tunnel"]
    restart: unless-stopped
    depends_on:
      nginx:
        condition: service_started
    command: ["tunnel", "--no-autoupdate", "--protocol", "http2", "--url", "http://nginx:80"]

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    ports:
      - "${MYSQL_FORWARD_PORT:-33060}:3306"
    environment:
      MYSQL_DATABASE: "${DB_DATABASE:-shopify_hub}"
      MYSQL_USER: "${DB_USERNAME:-shopify_hub}"
      MYSQL_PASSWORD: "${DB_PASSWORD:-local_development_only}"
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:-local_root_only}"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    ports:
      - "${REDIS_FORWARD_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  horizon:
    <<: *app
    stop_grace_period: 90s
    command: ["php", "artisan", "horizon"]

  pulse:
    <<: *app
    command: ["php", "artisan", "pulse:check"]

  scheduler:
    <<: *app
    command: ["php", "artisan", "schedule:work", "--verbose", "--no-interaction"]

  vite:
    image: node:22-alpine
    restart: unless-stopped
    working_dir: /var/www/html
    ports:
      - "${VITE_PORT:-5173}:5173"
    volumes:
      - ./:/var/www/html
      - node-modules:/var/www/html/node_modules
    command: ["sh", "-c", "[ -x node_modules/.bin/vite ] || npm ci; npm run dev -- --host 0.0.0.0"]

  mailpit:
    image: axllent/mailpit:v1.30.0
    restart: unless-stopped
    ports:
      - "${MAILPIT_FORWARD_PORT:-8025}:8025"
    volumes:
      - mailpit-data:/data
    environment:
      MP_DATABASE: /data/mailpit.db

volumes:
  bootstrap-cache:
  mysql-data:
  mailpit-data:
  node-modules:
  redis-data:
  storage:
  vendor:
