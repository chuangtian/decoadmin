client_id = "3c5fcae3d492476532735aa2f4090f98"
name = "Community Reviews"
handle = "deco-community-reviews-production"
application_url = "https://admin.decomkt.com/shopify-app/community-reviews"
embedded = true

[build]
automatically_update_urls_on_dev = false

[webhooks]
api_version = "2026-07"

[[webhooks.subscriptions]]
topics = ["app/uninstalled", "products/update", "products/delete"]
uri = "https://admin.decomkt.com/api/shopify-app/community-reviews/webhooks"

[access_scopes]
scopes = "read_products,write_app_proxy"
use_legacy_install_flow = false

[auth]
redirect_urls = ["https://admin.decomkt.com/shopify-app/community-reviews"]

[app_proxy]
url = "https://admin.decomkt.com/api/shopify-app/community-reviews/proxy"
subpath = "community-reviews"
prefix = "apps"
