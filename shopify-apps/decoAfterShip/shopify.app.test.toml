# Run `pnpm run config:link:test` to link this file to the existing test App.
# Shopify Client IDs are public identifiers, but this template intentionally
# leaves the value blank so repository clones cannot target an App by accident.

name = "decoAfterShip Test"
client_id = ""
application_url = "https://testadmin.decomkt.com/shopify/launch"
embedded = false
extension_directories = ["extensions/"]

[access_scopes]
scopes = "read_products,read_inventory,read_orders,read_customers,read_locations,read_reports,read_discounts,write_discounts"
use_legacy_install_flow = true

[auth]
redirect_urls = [
  "https://testadmin.decomkt.com/shopify/oauth/callback"
]

[webhooks]
api_version = "2026-07"

[build]
automatically_update_urls_on_dev = false
