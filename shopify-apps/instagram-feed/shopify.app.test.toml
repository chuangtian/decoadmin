# 测试环境配置。注意：这里用的是与生产同一个 Shopify App
# （client_id d3446448682d2950aa75cea4a399d50f，handle deco-instagram-feed）。
#
# 一个 Shopify App 只有一份 application_url 与一组 webhook 地址，所以生产与测试
# 不能同时生效：发布这份配置＝把该 App 指向测试服，生产入口同时停用。
# 这是经用户确认的临时安排（生产侧当前没有任何店铺安装）。
#
# 要切回生产：改 extensions/app-home/src/runtime.mjs 的 appOrigin 与 environment、
# 把 shopify.app.toml 换成 production 镜像，然后 `npm run deploy:production`。
# shopify.app.production.toml 保持生产地址不动，就是这个还原点。
client_id = "d3446448682d2950aa75cea4a399d50f"
name = "Instagram Feed (Deco)"
handle = "deco-instagram-feed"
application_url = "https://testadmin.decomkt.com/shopify-app/instagram-feed"
embedded = true

[build]
automatically_update_urls_on_dev = false

# 授权码安装流程不接受 app 级 webhook 订阅，所以这里只声明 api_version，
# app/uninstalled 与 app/scopes_update 由 DecoAdmin 在授权成功后按店铺注册
# （InstagramFeedWebhookSubscriptionService），与 Commerce Hub 一致。
[webhooks]
api_version = "2026-07"

# 前台数据走 app-data metafield，不需要 App Proxy；商品标题与 handle 实时查 Admin API。
[access_scopes]
scopes = "read_products"
# DecoAdmin 用授权码回调建立本 App 的 offline token（对齐 Commerce Hub），
# 所以保持 legacy install flow；切成 Shopify 托管安装需要后端改回 token exchange。
use_legacy_install_flow = true

[auth]
redirect_urls = [ "https://testadmin.decomkt.com/shopify-app/instagram-feed/oauth/callback" ]
