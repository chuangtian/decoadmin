# 生产环境配置。注意：这里用的是与测试同一个 Shopify App
# （client_id d3446448682d2950aa75cea4a399d50f，handle deco-instagram-feed）。
#
# 一个 Shopify App 只有一份 application_url 与一组 webhook 地址，所以生产与测试
# 不能同时生效：发布这份配置＝把该 App 指回生产，测试入口同时停用。
#
# 当前该 App 指向测试服用于联调，这份配置是切回生产的还原点，地址保持不动。
client_id = "d3446448682d2950aa75cea4a399d50f"
name = "Instagram Feed (Deco)"
handle = "deco-instagram-feed"
application_url = "https://admin.decomkt.com/shopify-app/instagram-feed"
embedded = true

[build]
automatically_update_urls_on_dev = false

# 安装由 Shopify 托管（不再声明 use_legacy_install_flow），所以可以直接在配置里声明
# app 级 webhook 订阅，由 Shopify 统一管理与重投。DecoAdmin 侧不再按店铺注册，
# 也因此「装了但从未打开过应用」的店铺卸载时同样能收到通知。
[webhooks]
api_version = "2026-07"

  [[webhooks.subscriptions]]
  topics = [ "app/uninstalled" ]
  uri = "https://admin.decomkt.com/api/shopify-app/instagram-feed/webhooks"

  [[webhooks.subscriptions]]
  topics = [ "app/scopes_update" ]
  uri = "https://admin.decomkt.com/api/shopify-app/instagram-feed/webhooks"

# 前台数据走 app-data metafield，不需要 App Proxy；商品标题与 handle 实时查 Admin API。
#
# write_metaobjects 用于主题编辑器里的展示组选择器：区块设置的 schema 是构建期静态的，
# 没法列出某个店铺自己的组名，metaobject 是官方唯一支持「按店铺动态取选项」的设置类型。
# App 用 $app: 前缀建自己独占的 definition，每个展示组写一条条目。
# 加这个 scope 意味着商家必须重新授权，见 README 的部署顺序。
[access_scopes]
scopes = "read_products,write_metaobjects"

# 托管安装下后端没有授权码回调，但 Shopify CLI 的 schema 仍要求声明 [auth]。
# 与 deco-personalization 一致，指向 App Home 入口本身。
[auth]
redirect_urls = [ "https://admin.decomkt.com/shopify-app/instagram-feed" ]
