# Shopify CLI 的「当前选中配置」，由 `shopify app config use` 维护。
# 只保留生产一套环境：Cloudflare 隧道已废弃，测试环境不再单独占用 Shopify App。
# 这里与 shopify.app.production.toml 保持一致，避免漏写 --config 时推错目标。
client_id = "d3446448682d2950aa75cea4a399d50f"
name = "Instagram Feed (Deco)"
handle = "deco-instagram-feed"
application_url = "https://admin.decomkt.com/shopify-app/instagram-feed"
embedded = true

[build]
include_config_on_deploy = true
automatically_update_urls_on_dev = false

[webhooks]
api_version = "2026-07"

[[webhooks.subscriptions]]
topics = [ "app/uninstalled" ]
uri = "https://admin.decomkt.com/api/shopify-app/instagram-feed/webhooks"

[[webhooks.subscriptions]]
topics = [ "app/scopes_update" ]
uri = "https://admin.decomkt.com/api/shopify-app/instagram-feed/webhooks"

# 前台数据走 app-data metafield，不需要 App Proxy；商品标题与 handle 实时查 Admin API。
[access_scopes]
scopes = "read_products"
use_legacy_install_flow = false

[auth]
redirect_urls = [ "https://admin.decomkt.com/api/shopify-app/auth/callback" ]
