# Shopify CLI 的「当前选中配置」，由 `shopify app config use` 维护。
#
# 当前镜像的是 shopify.app.test.toml：该 Shopify App 已临时指向测试服
# （https://testadmin.decomkt.com），生产入口同时停用。生产与测试共用同一个
# client_id，一个 App 只有一份 application_url 与一组 webhook 地址，两者不能同时生效。
#
# 这里与选中的那套环境配置保持逐字一致，避免漏写 --config 时推错目标。
# 切回生产的步骤见 README「切换环境」。
client_id = "d3446448682d2950aa75cea4a399d50f"
name = "Instagram Feed (Deco)"
handle = "deco-instagram-feed"
application_url = "https://testadmin.decomkt.com/shopify-app/instagram-feed"
embedded = true

[build]
include_config_on_deploy = true
automatically_update_urls_on_dev = false

# 安装由 Shopify 托管（不再声明 use_legacy_install_flow），所以可以直接在配置里声明
# app 级 webhook 订阅，由 Shopify 统一管理与重投。DecoAdmin 侧不再按店铺注册，
# 也因此「装了但从未打开过应用」的店铺卸载时同样能收到通知。
[webhooks]
api_version = "2026-07"

  [[webhooks.subscriptions]]
  topics = [ "app/uninstalled" ]
  uri = "https://testadmin.decomkt.com/api/shopify-app/instagram-feed/webhooks"

  [[webhooks.subscriptions]]
  topics = [ "app/scopes_update" ]
  uri = "https://testadmin.decomkt.com/api/shopify-app/instagram-feed/webhooks"

# 前台数据走 app-data metafield，不需要 App Proxy；商品标题与 handle 实时查 Admin API。
[access_scopes]
scopes = "read_products"

# 托管安装下后端没有授权码回调，但 Shopify CLI 的 schema 仍要求声明 [auth]。
# 与 deco-personalization 一致，指向 App Home 入口本身。
[auth]
redirect_urls = [ "https://testadmin.decomkt.com/shopify-app/instagram-feed" ]
