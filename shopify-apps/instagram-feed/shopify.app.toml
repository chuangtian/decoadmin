# Shopify CLI 的「当前选中配置」，由 `shopify app config use` 维护。
# 默认指向 local，与 shopify.app.local.toml 保持一致。
client_id = "d3446448682d2950aa75cea4a399d50f"
name = "Deco-Instagram-内容-local"
handle = "deco-instagram-feed-local"
application_url = "https://wendy-interim-classic-segment.trycloudflare.com/shopify-app/instagram-feed"
embedded = true

[build]
include_config_on_deploy = true
automatically_update_urls_on_dev = false

[webhooks]
api_version = "2026-07"

[[webhooks.subscriptions]]
topics = [ "app/uninstalled" ]
uri = "https://wendy-interim-classic-segment.trycloudflare.com/api/shopify-app/instagram-feed/webhooks"

[[webhooks.subscriptions]]
topics = [ "app/scopes_update" ]
uri = "https://wendy-interim-classic-segment.trycloudflare.com/api/shopify-app/instagram-feed/webhooks"

[access_scopes]
scopes = "read_products"
use_legacy_install_flow = false

[auth]
redirect_urls = [ "https://wendy-interim-classic-segment.trycloudflare.com/api/shopify-app/auth/callback" ]
